deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  practice: >-
    AdvicePay has no written deprecation POLICY document, but it demonstrably PRACTICES managed
    deprecation, and the current live example is a good one: a banner at the top of the reference,
    a named deadline, backward-compatible dual behavior during the transition, and an opt-in
    parameter so integrators can test the post-deprecation payload before the cutover. What is
    missing is the machine-readable half — no RFC 8594 Sunset or Deprecation response headers, so
    a client learns about a retirement only by a human reading the docs.
  active_deprecations:
  - id: invoice-status-canceled
    subject: The "canceled" invoice status string
    replacement: voided
    announced_in: https://docs.advicepay.com/#invoices
    sunset_date: '2026-12-02'
    breaking: true
    current_behavior: >-
      Filtering by either "canceled" or "voided" temporarily returns the same results. Response
      payloads still return "canceled" by default.
    opt_in_mechanism:
      parameter: useVoidedStatus
      location: query
      type: boolean
      default: false
      description: >-
        Set true to receive "voided" instead of "canceled" in the invoice payload response, so an
        integration can be tested and verified ahead of the deadline.
    on_sunset: >-
      The API will no longer accept or return the "canceled" string, and the temporary
      useVoidedStatus parameter will itself be removed.
    affected_operations:
    - GET /api/public/v1/invoices
    - GET /api/public/v1/invoices/{id}
  deprecated_fields:
  - field: Signer.signedAt
    replacement: completedAt
    source: https://docs.advicepay.com/#schemaSigner
    note: Marked "[DEPRECATED - See completedAt]" in the Signer schema.
  - field: Invoice.description
    replacement: serviceDescriptions
    source: https://docs.advicepay.com/#schemaInvoice
    note: >-
      "This is the first description in the list of descriptions on the invoice that the advisor
      provided. Deprecated." — superseded by the structured service-description list.
deprecated_operations: []
