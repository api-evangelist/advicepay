    No publication date is given; captured from the live reference on 2026-09-09. The associated
    cutover date is 2026-12-02.
  breaking: true
  announced_in: https://docs.advicepay.com/#invoices
  highlights:
  - >-
    Invoice status nomenclature is moving from "canceled" to "voided". Filtering accepts both
    during the transition; payload responses still return "canceled" by default.
  - >-
    New opt-in query parameter useVoidedStatus (boolean, default false) makes invoice payloads
    return "voided" early so integrations can be tested before the cutover.
  - >-
    On 2026-12-02 the API will stop accepting and returning "canceled", and the temporary
    useVoidedStatus parameter will itself be removed.
  additions:
  - useVoidedStatus query parameter on the invoice endpoints
  deprecations:
  - Invoice status value "canceled" (replaced by "voided"), sunset 2026-12-02
  - Signer.signedAt field (replaced by completedAt)
  - Invoice.description field (replaced by the structured serviceDescriptions list)
