core_flow: >-
  Office -> Advisor -> Client is the tenancy spine. An Advisor and a Client meet in an Engagement,
  which is backed by an Agreement (eSigned by Signers) and produces Deliverables. Billing hangs off
  the Engagement: either a one-off Invoice or a Subscription that generates Invoices on a cadence.
  Money collected settles into Transfers, each composed of Transactions that point back at the
  Invoices they paid. Notifications is the flat, pollable audit feed across all of it.
