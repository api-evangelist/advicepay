note: >-
  Derived from the Schemas section of the published AdvicePay reference (44 schemas) and the
  id-reference fields carried on each resource. AdvicePay publishes no OpenAPI, so this graph was
  read from the documented property tables rather than from $ref links in a spec; relationships
  are inferred from the <entity>ID foreign-key fields the docs describe, and each is labelled with
  the field it travels on so a reader can verify it.
identifiers:
  format: integer
  prefixes: none
  note: >-
    Ids are plain integers with no type prefix, so an id is not self-describing — a bare 42 could
    be an invoice, a client or an office. Cross-references are named <entity>ID.
external_ids:
  supported: true
  fields:
  - externalID
  - advisorExternalID
  - clientExternalID
  - externalUserID
  - externalEngagementID
  - ssoID
  note: >-
    Most core entities carry an externalID (and several carry counterpart-scoped variants), which
    is the documented hook for keying AdvicePay records to a firm's CRM or book-of-record. ssoID
    links a user to an external identity provider for SAML SSO.
