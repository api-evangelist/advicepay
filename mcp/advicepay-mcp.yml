agent_safety_note: >-
  If this candidate is ever built, four tools need guardrails that the underlying API does not
  provide: create_invoice, create_subscription and refund_invoice move real money, and
  create_subscription cannot be reversed through the API at all (no cancel operation exists).
  There is also no idempotency key on any write, so a retried tool call can double-fire. See
  conventions/advicepay-conventions.yml.
