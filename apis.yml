aid: advicepay
name: AdvicePay
description: AdvicePay is a fee-for-service billing, payment processing and engagement-management platform
  built for financial advisors, RIAs and broker-dealers. Founded by Michael Kitces and Alan Moore, it
  lets firms invoice clients for financial planning advice, collect card and ACH payments, run recurring
  subscriptions, capture eSignatures, track engagement workflows and deliverables, and enforce compliance
  oversight over advisor billing. AdvicePay publishes a public REST API (v1.0.1) at app.advicepay.com/api/public/v1
  covering admins, advisors, agreements, clients, custom attributes, deliverables, engagements, invoices,
  notifications, offices, subscriptions and transfers, secured with OAuth 2.0 (authorization code and
  client credentials, with client_secret_post, client_secret_jwt and private_key_jwt authentication methods)
  plus SAML 2.0 single sign-on. API access is an Enterprise-plan capability.
