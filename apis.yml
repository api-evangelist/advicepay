x-contract-discovery:
  date: '2026-09-09'
  result: no-machine-readable-contract
  detail: AdvicePay documents 55 REST operations across 13 resources in a fully public, server-rendered
    reference at docs.advicepay.com, but publishes no machine-readable description of any kind. The reference
    is a Slate page whose shape (a Base URLs block, per-operation parameter tables, a Schemas section
    with 44 schemas including a oneOf/xor Pagination union) is characteristic of widdershins output, which
    strongly implies an OpenAPI document exists internally. It is not served anywhere reachable. No spec
    has been generated from the documentation, because a contract this pipeline authored would be a fabrication.
  probes:
  - hosts:
    - https://docs.advicepay.com
    - https://app.advicepay.com
    - https://advicepay.com
    - https://demo.advicepay.com
    paths:
    - /openapi.json
    - /openapi.yaml
    - /openapi.yml
    - /swagger.json
    - /swagger.yaml
    - /api-docs
    - /v1/openapi.json
    - /api/openapi.json
    - /redoc
    - /docs/openapi.json
    - /spec.json
    - /source/openapi.json
    - /api/v1/swagger.json
    - /apis.json
    result: no 200 carrying a parsing OpenAPI or Swagger document on any host/path combination
  - target: graphql
    result: no GraphQL surface is documented or discoverable
  - target: mcp
    endpoints_probed:
    - https://mcp.advicepay.com/mcp
    - https://app.advicepay.com/mcp
    - https://app.advicepay.com/api/mcp
    - https://advicepay.com/mcp
    result: DNS failure or 404/403 on every endpoint; no tools/list responded
  - target: a2a-agent-card
    paths:
    - /.well-known/agent-card.json
    - /.well-known/agent.json
    hosts_probed: 5
    result: 404 on every host (403 on the S3-backed docs bucket); no card exists
  - target: soap-wsdl
    result: No SOAP surface. ?wsdl returns 404 on app.advicepay.com; advicepay.com returns its ordinary
      HubSpot homepage with the query string ignored, which is not a WSDL.
  - target: ogc
    result: not applicable - no geospatial surface and no evidence pointing at one
  - target: asyncapi-webhooks
    result: No event surface exists. The string "webhook" does not appear anywhere in the reference; change
      notification is polling-only via GET /api/public/v1/notifications.
  docs_host_note: docs.advicepay.com is a static S3 bucket. It answers 403 AccessDenied for any key that
    does not exist, which is that host's equivalent of a 404 and must not be read as an auth wall.
  provider_fixable: 'Publishing the underlying OpenAPI at docs.advicepay.com/openapi.json would be a small
    change with a large effect: it is very likely already generated to build these docs.'
